<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PanaSur Express | Tu puente financiero</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-grid"></div>

  <header>
    <!-- Quitamos el marco redondo para que se vea el eslogan completo -->
    <img src="logo.png" alt="PanaSur Express Logo" class="logo">
    <h1>PanaSur <span>Express</span></h1>
    <p class="slogan">Tu puente financiero</p>
  </header>

  <main>
    <section class="calculadora">
      <div class="status-badge">
        <span class="dot"></span> TASA DEL DÍA <span id="fecha-actualizacion">24/11/2026</span>
      </div>

      <h2>Calcula tu envío</h2>

      <div class="input-group">
        <label for="ruta">Ruta de envío:</label>
        <select id="ruta">
          <option value="CRC_VES">Costa Rica (₡) → Venezuela (Bs.)</option>
          <option value="VES_CRC">Venezuela (Bs.) → Costa Rica (₡)</option>
          <option value="CRC_COP">Costa Rica (₡) → Colombia ($)</option>
          <option value="COP_CRC">Colombia ($) → Costa Rica (₡)</option>
          <option value="COP_VES">Colombia ($) → Venezuela (Bs.)</option>
          <option value="VES_COP">Venezuela (Bs.) → Colombia ($)</option>
        </select>
      </div>

      <div class="input-group">
        <label for="monto">Monto a enviar (<span id="moneda-entrada-label">CRC</span>):</label>
        <input type="number" id="monto" placeholder="0.00" min="0">
        <div class="quick-amounts">
          <button class="btn-quick" data-amount="1000">+1.000</button>
          <button class="btn-quick" data-amount="5000">+5.000</button>
          <button class="btn-quick" data-amount="10000">+10.000</button>
          <button class="btn-quick" data-amount="50000">+50.000</button>
        </div>
      </div>

      <div class="resultado-card">
        <div class="tasa-info">
          <p>Tasa actual:</p>
          <!-- Aquí mostraremos $1 = 960 Bs. -->
          <strong id="tasa">—</strong>
        </div>
        
        <div class="total-info">
          <p>El cliente recibe:</p>
          <div class="total-row">
            <h3 id="resultado">—</h3>
            <button id="btn-copiar" title="Copiar resultado">📋</button>
          </div>
        </div>
      </div>

      <a id="whatsapp" class="btn-whatsapp" href="#" target="_blank">
        <span>📲</span> Contactar por WhatsApp
      </a>

      <p class="aviso">Tasas sujetas a cambios sin previo aviso.</p>
    </section>
  </main>

  <footer>
    <p>© PanaSur Express · Darwin Caruci · +506 6478 4402</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
